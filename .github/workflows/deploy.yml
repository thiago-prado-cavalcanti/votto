name: Deploy

# Push to the deploy branch → SSH into the Lightsail box → pull + rebuild + migrate.
# Manual run is also available (Actions tab → Deploy → Run workflow).
on:
  push:
    branches: [feature/project-bootstrap]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/votto
            git pull --ff-only origin feature/project-bootstrap
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate
            docker compose --env-file .env.production -f docker-compose.prod.yml --profile proxy up -d
            docker image prune -f
