name: Deploy

# Push to the deploy branch → SSH into the Lightsail box → sync code, build,
# MIGRATE (before serving), then bring services up. Manual run also available.
on:
  push:
    branches: [feature/project-bootstrap]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script: |
            set -e
            cd ~/votto

            # 1) Make the working tree EXACTLY match the remote branch (avoids
            #    "pull was a no-op" / stale-source builds). .env.production is
            #    untracked, so it is preserved.
            git fetch --prune origin
            git reset --hard origin/feature/project-bootstrap

            COMPOSE="docker compose --env-file .env.production -f docker-compose.prod.yml"

            # 2) Build images from the now-current source.
            #    `migrate` sits behind the "tools" profile, and a bare
            #    `compose build` skips services in inactive profiles — so it was
            #    silently keeping a stale migrate image and running migrations
            #    from old source. Name every buildable service explicitly.
            $COMPOSE build web worker migrate

            # 3) Bring up data services and apply pending migrations BEFORE the
            #    web app serves traffic — schema and code always move together.
            $COMPOSE up -d db redis
            $COMPOSE run --rm migrate

            # 4) Start/refresh the app + HTTPS proxy.
            $COMPOSE up -d
            $COMPOSE --profile proxy up -d

            docker image prune -f
